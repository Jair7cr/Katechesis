# Publica no Cloudflare a cada envio para a branch main, depois que os testes passam.
# Antes da primeira vez, rode o workflow "Primeira configuração".
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: publicar, cancel-in-progress: false }

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Atualizar o banco (migrações)
        run: npm run migrar
        env:
          DATABASE_URL_DONO: ${{ secrets.NEON_URL_DONO }}
      - run: npm run construir
      - name: Publicar no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
